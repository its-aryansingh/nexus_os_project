# ═══════════════════════════════════════════════════════════════════════════════
# Nexus OS — Default application configuration.
# Profile overrides live in application-{local,test,prod}.yml.
# All sensitive values come from environment variables (12-factor).
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: nexus-os
  profiles:
    active: local
  threads:
    virtual:
      enabled: true                     # Java 21 virtual threads for blocking IO
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # ── Datasource (Postgres) ────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus_os}
    username: ${SPRING_DATASOURCE_USERNAME:nexus}
    password: ${SPRING_DATASOURCE_PASSWORD:nexus_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: NexusHikari
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate                # Flyway owns schema; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # ── Flyway ───────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: nexus-os-consumers
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        spring.json.trusted.packages: "com.nexus.os.*"
        isolation.level: read_committed
    listener:
      ack-mode: manual
      concurrency: 3

  # ── Redis (L2 cache + rate-limit store) ──────────────────────────────────────
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: 8081
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ── Temporal ───────────────────────────────────────────────────────────────────
temporal:
  service-address: ${TEMPORAL_SERVICE_ADDRESS:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:nexus-default-queue}

# ── Qdrant ─────────────────────────────────────────────────────────────────────
qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  api-key: ${QDRANT_API_KEY:}
  host: localhost
  port: 6334
  collection-name: nexus-memory
  default-collection-prefix: tenant_
  vector-size: 1536

# ── LangChain4j ────────────────────────────────────────────────────────────────
langchain4j:
  open-ai:
    # LANGCHAIN4J_OPEN_AI_API_KEY is the framework-canonical name; OPENAI_API_KEY
    # is honoured as a fallback for compat with simpler workflows.
    api-key: ${LANGCHAIN4J_OPEN_AI_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${LANGCHAIN4J_OPEN_AI_BASE_URL:}        # blank => OpenAI default; set to Ollama URL for BYOM
    model-name: ${LANGCHAIN4J_OPEN_AI_MODEL_NAME:gpt-4o-mini}
    temperature: ${LANGCHAIN4J_OPEN_AI_TEMPERATURE:0.7}
    max-tokens: ${LANGCHAIN4J_OPEN_AI_MAX_TOKENS:2048}
    timeout: 60s
    log-requests: false
    log-responses: false

# ── Nexus-specific config ──────────────────────────────────────────────────────
nexus:
  mock-mode:
    auto-enable: true                   # mock providers when API keys are blank
  tenancy:
    header-name: X-Tenant-Id
    pg-session-var: app.current_tenant
    default-tenant-id: "00000000-0000-0000-0000-000000000001"  # for v0.1 dev (no auth)
  cost:
    monthly-budget-usd-default: 50
  model-router:
    cheap-model: gpt-4o-mini
    expensive-model: gpt-4o
    escalation-threshold: 0.7
  tribunal:
    default-jurors: 3
    disagreement-threshold: 0.34
  cache:
    prompt:
      l1-max-entries: 10000
      l1-ttl: PT5M
      l2-ttl: PT1H
      l3-ttl: PT24H
  whatsapp:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_WHATSAPP_NUMBER:+14155238886}
      webhook-validation: ${TWILIO_VALIDATE_WEBHOOK:true}
  mcp:
    server-port: ${NEXUS_MCP_SERVER_PORT:8082}
    expose: true
  a2a:
    base-url: ${NEXUS_A2A_BASE_URL:http://localhost:8083}
    expose: true

# ── Resilience4j ───────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      openai:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 20
        permitted-number-of-calls-in-half-open-state: 3
      twilio:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
      qdrant:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
        sliding-window-size: 20
      tenant-budget:
        failure-rate-threshold: 1       # any budget breach opens the circuit
        wait-duration-in-open-state: 600s  # 10min cool-down after breach
        sliding-window-size: 1
  bulkhead:
    instances:
      llm:
        max-concurrent-calls: 20
        max-wait-duration: 5s
  ratelimiter:
    instances:
      openai-per-tenant:
        limit-for-period: 60
        limit-refresh-period: 1m
        timeout-duration: 0s
  retry:
    instances:
      openai:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

# ── Actuator + Observability ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,env,beans,mappings,scheduledtasks
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0                  # 100% sampling in dev; lower in prod
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    com.nexus.os: INFO
    org.springframework.web: INFO
    io.temporal: WARN
    org.apache.kafka: WARN
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} tenant=%X{tenantId:-}]"
    console: "%d{HH:mm:ss.SSS} %-5level ${LOGGING_PATTERN_CORRELATION} %logger{20} - %msg%n"
